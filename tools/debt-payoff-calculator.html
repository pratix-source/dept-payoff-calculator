mentById('themeBtn').textContent='☀️'}document.getElementById('add').onclick=()=>{document.getElementById('debts').appendChild(debtRow({name:'Debt',balance:1000,apr:18,min:50}));apply()};document.getElementById('calc').onclick=calc;document.getElementById('csv').onclick=csv;document.getElementById('print').onclick=()=>print();['extra','method'].forEach(id=>document.getElementById(id).oninput=calc);document.getElementById('debts').append(debtRow({name:'Credit Card',balance:4500,apr:21,min:120}),debtRow({name:'Personal Loan',balance:8000,apr:11,min:220}),debtRow({name:'Store Card',balance:1200,apr:28,min:45}));apply();calc();
